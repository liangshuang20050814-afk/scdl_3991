MODEL:
  model_name: TRIPLEX
  emb_dim: 1024
  depth1: 1
  depth2: 2
  depth3: 2
  num_heads1: 8
  num_heads2: 16
  num_heads3: 16
  mlp_ratio1: 2
  mlp_ratio2: 2
  mlp_ratio3: 2
  dropout1: 0.15
  dropout2: 0.1
  dropout3: 0.1
  kernel_size: 3
  pos_layer: 'APEG'
  selector_mode: straight_through
  selector_dim: 64
  selector_temperature: 1.0
  selector_budget_loss_weight: 0.0
  selector_use_similarity_prior: false
  selector_similarity_prior_weight: 1.0
  selector_learned_score_weight: 1.0
  num_selected_patches: 20

DATA:
  dataset_name: TriDataset
  neighbor_selection: attention_st20
  num_selected_patches: 20

