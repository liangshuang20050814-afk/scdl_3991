MODEL:
  model_name: TRIPLEX
  emb_dim: 1024
  depth1: 1
  depth2: 2
  depth3: 2
  num_heads1: 8
  num_heads2: 16
  num_heads3: 16
  mlp_ratio1: 2
  mlp_ratio2: 2
  mlp_ratio3: 2
  dropout1: 0.15
  dropout2: 0.1
  dropout3: 0.1
  kernel_size: 3
  pos_layer: 'APEG'

DATA:
  dataset_name: TriDataset
  neighbor_selection: diversity20
  num_selected_patches: 20
